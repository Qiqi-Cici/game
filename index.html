  <body>
    <canvas id="scene"></canvas>

    <div id="hud" class="hidden">
      <div class="corner tl">
        <div class="chip brand">
          <span class="brand-dot"></span>
          <div>
            <h1>兜风都市</h1>
            <p id="status">加载中…</p>
          </div>
        </div>
        <div class="chip wallet" title="等级与金币">
          <span class="lv" id="lv">1</span>
          <div class="xp"><i id="xp-fill"></i></div>
          <span class="coin" id="coins">0</span>
        </div>
        <div class="chip district" id="district"></div>
      </div>

      <nav class="corner tr actions">
        <button class="btn" id="btn-jobs" type="button"><kbd>J</kbd><span>任务</span></button>
        <button class="btn" id="btn-garage" type="button"><kbd>G</kbd><span>车库</span></button>
        <button class="btn" id="btn-camera" type="button"><kbd>C</kbd><span>视角</span></button>
        <button class="btn" id="btn-time" type="button"><kbd>N</kbd><span>昼夜</span></button>
        <button class="btn" id="btn-weather" type="button"><kbd>T</kbd><span>天气</span></button>
        <button class="btn primary" id="btn-menu" type="button"><kbd>Esc</kbd><span>菜单</span></button>
      </nav>

      <div class="corner tc">
        <div class="mission hidden" id="mission">
          <b id="mission-title"></b>
          <span id="mission-line"></span>
          <em id="mission-time"></em>
          <small id="mission-dist"></small>
        </div>
        <div id="feed" role="status"></div>
      </div>

      <div class="corner bl">
        <canvas id="minimap" width="440" height="440"></canvas>
      </div>

      <div class="corner bc">
        <div class="drift" id="drift"></div>
        <div class="radio" id="radio">
          <kbd>,</kbd>
          <div><b id="radio-name">电台</b><span id="radio-tag"></span></div>
          <kbd>.</kbd>
        </div>
        <p class="hint" id="hint">
          <b>W A S D</b> 驾驶 · <b>空格</b> 手刹漂移 · <b>Shift</b> 氮气 · <b>B</b> 喇叭 · <b>R</b> 重置 · <b>P</b> 拍照 · <b>M</b> 地图
        </p>
      </div>

      <section class="corner br speedo" aria-label="速度">
        <svg viewBox="0 0 200 200" class="gauge" aria-hidden="true">
          <path class="gauge-track" d="M 44.85 155.15 A 78 78 0 1 1 155.15 155.15" />
          <path class="gauge-fill" id="gauge-fill" d="M 44.85 155.15 A 78 78 0 1 1 155.15 155.15" />
          <path class="rpm-track" d="M 34.24 165.76 A 93 93 0 1 1 165.76 165.76" />
          <path class="rpm-fill" id="rpm-fill" d="M 34.24 165.76 A 93 93 0 1 1 165.76 165.76" />
        </svg>
        <div class="readout">
          <span id="speed">0</span>
          <small>km/h</small>
        </div>
        <span class="gear" id="gear">N</span>
        <div class="nitro" title="氮气"><i id="nitro-fill"></i></div>
      </section>
    </div>

    <div id="bigmap" class="hidden"><canvas id="bigmap-canvas" width="900" height="900"></canvas><p>按 <b>M</b> 关闭地图</p></div>
    <div id="overlay"></div>
    <div id="flash"></div>

    <div id="loading">
      <div class="loading-box">
        <h1>兜风都市</h1>
        <p class="loading-en">JOYRIDE CITY</p>
        <div class="loading-bar"><i id="loading-fill"></i></div>
        <p id="loading-text">正在加载城市…</p>
      </div>
    </div>

  </body>
